<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tetra Agent Test</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f8;
      --panel: #ffffff;
      --text: #202428;
      --muted: #68727d;
      --line: #d8dde3;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --danger: #b42318;
      --ok: #137333;
      --code: #101418;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .bar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto;
      gap: 16px;
      align-items: center;
      max-width: 1220px;
      margin: 0 auto;
      padding: 14px 18px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 680;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 0 10px;
      border: 1px solid var(--line);
      background: #fafbfc;
      border-radius: 6px;
      color: var(--muted);
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #a0a8b0;
    }

    .status.ok .dot {
      background: var(--ok);
    }

    .status.err .dot {
      background: var(--danger);
    }

    main {
      max-width: 1220px;
      margin: 0 auto;
      padding: 18px;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 680;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 620;
    }

    input,
    textarea,
    select {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text);
      background: #fff;
      font: inherit;
    }

    textarea {
      min-height: 360px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
      tab-size: 2;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-weight: 620;
      cursor: pointer;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    button.primary:hover {
      background: var(--accent-strong);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    pre {
      min-height: 460px;
      margin: 0;
      overflow: auto;
      border-radius: 6px;
      background: var(--code);
      color: #ecf2f8;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .modules {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .module {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px;
      background: #fbfcfd;
    }

    .module strong {
      display: block;
      margin-bottom: 5px;
    }

    .module span {
      display: inline-block;
      margin: 2px 5px 2px 0;
      padding: 2px 6px;
      border-radius: 999px;
      background: #edf2f7;
      color: #3d4650;
      font-size: 12px;
    }

    @media (max-width: 860px) {
      .bar,
      .layout {
        grid-template-columns: 1fr;
      }

      .status {
        width: 100%;
        justify-content: center;
      }

      textarea,
      pre {
        min-height: 300px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <h1>Tetra Agent Test</h1>
      <div id="status" class="status"><span class="dot"></span><span id="statusText">Not connected</span></div>
    </div>
  </header>

  <main>
    <div class="layout">
      <div>
        <section>
          <h2>Connection</h2>
          <label for="endpoint">Agent URL</label>
          <input id="endpoint" value="http://127.0.0.1:7777" spellcheck="false">

          <label for="token">Bearer Token</label>
          <input id="token" type="password" autocomplete="off">

          <div class="actions">
            <button id="healthBtn">Health</button>
            <button id="capabilitiesBtn">Capabilities</button>
          </div>
        </section>

        <section style="margin-top: 14px;">
          <h2>Presets</h2>
          <div class="row">
            <button data-preset="settings">Settings</button>
            <button data-preset="caps">Capabilities</button>
            <button data-preset="services">Service Dry Run</button>
            <button data-preset="quadlets">Quadlet Dry Run</button>
          </div>
        </section>

        <section style="margin-top: 14px;">
          <h2>Modules</h2>
          <div id="modules" class="modules"></div>
        </section>
      </div>

      <section>
        <h2>Command</h2>
        <textarea id="command" spellcheck="false"></textarea>
        <div class="actions">
          <button id="dispatchBtn" class="primary">Dispatch</button>
          <button id="formatBtn">Format JSON</button>
        </div>
      </section>

      <section style="grid-column: 1 / -1;">
        <h2>Response</h2>
        <pre id="response"></pre>
      </section>
    </div>
  </main>

  <script>
    const endpointInput = document.getElementById("endpoint");
    const tokenInput = document.getElementById("token");
    const commandInput = document.getElementById("command");
    const responseEl = document.getElementById("response");
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const modulesEl = document.getElementById("modules");

    const presets = {
      settings: {
        id: "ui-settings",
        module: "settings",
        action: "get_system",
        payload: {}
      },
      caps: {
        id: "ui-capabilities",
        module: "agent",
        action: "capabilities",
        payload: {}
      },
      services: {
        id: "ui-service-dry-run",
        module: "services",
        action: "restart",
        payload: {
          service: "sshd.service",
          dry_run: true
        }
      },
      quadlets: {
        id: "ui-quadlet-dry-run",
        module: "quadlets",
        action: "install",
        payload: {
          base_dir: "/tmp/tetra-quadlets",
          dry_run: true,
          resources: [
            {
              filename: "demo.container",
              contents: "[Container]\nImage=quay.io/podman/hello\n"
            }
          ]
        }
      }
    };

    endpointInput.value = localStorage.getItem("tetraEndpoint") || endpointInput.value;
    tokenInput.value = localStorage.getItem("tetraToken") || "";
    commandInput.value = JSON.stringify(presets.settings, null, 2);

    endpointInput.addEventListener("input", () => localStorage.setItem("tetraEndpoint", endpointInput.value));
    tokenInput.addEventListener("input", () => localStorage.setItem("tetraToken", tokenInput.value));

    document.querySelectorAll("[data-preset]").forEach((button) => {
      button.addEventListener("click", () => {
        commandInput.value = JSON.stringify(presets[button.dataset.preset], null, 2);
      });
    });

    document.getElementById("formatBtn").addEventListener("click", () => {
      try {
        commandInput.value = JSON.stringify(JSON.parse(commandInput.value), null, 2);
      } catch (error) {
        showError(error);
      }
    });

    document.getElementById("healthBtn").addEventListener("click", () => callAgent("GET", "/health"));
    document.getElementById("capabilitiesBtn").addEventListener("click", async () => {
      const data = await callAgent("GET", "/capabilities");
      if (data && data.payload && Array.isArray(data.payload.modules)) {
        renderModules(data.payload.modules);
      }
    });

    document.getElementById("dispatchBtn").addEventListener("click", async () => {
      let command;
      try {
        command = JSON.parse(commandInput.value);
      } catch (error) {
        showError(error);
        return;
      }

      const data = await callAgent("POST", "/dispatch", command);
      if (data && data.payload && Array.isArray(data.payload.modules)) {
        renderModules(data.payload.modules);
      }
    });

    async function callAgent(method, path, body) {
      setBusy(true);
      try {
        const headers = {};
        if (body) headers["Content-Type"] = "application/json";
        if (tokenInput.value) headers.Authorization = `Bearer ${tokenInput.value}`;

        const response = await fetch(`${endpointInput.value.replace(/\/$/, "")}${path}`, {
          method,
          headers,
          body: body ? JSON.stringify(body) : undefined
        });
        const text = await response.text();
        let data;
        try {
          data = text ? JSON.parse(text) : null;
        } catch {
          data = text;
        }

        responseEl.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
        setStatus(response.ok ? "ok" : "err", response.ok ? "Connected" : `HTTP ${response.status}`);
        return data;
      } catch (error) {
        showError(error);
        return null;
      } finally {
        setBusy(false);
      }
    }

    function renderModules(modules) {
      modulesEl.innerHTML = "";
      for (const module of modules) {
        const item = document.createElement("div");
        item.className = "module";
        const name = document.createElement("strong");
        name.textContent = module.name;
        item.appendChild(name);
        for (const action of module.actions || []) {
          const pill = document.createElement("span");
          pill.textContent = action;
          item.appendChild(pill);
        }
        modulesEl.appendChild(item);
      }
    }

    function showError(error) {
      responseEl.textContent = error && error.stack ? error.stack : String(error);
      setStatus("err", "Error");
    }

    function setStatus(kind, text) {
      statusEl.className = `status ${kind}`;
      statusText.textContent = text;
    }

    function setBusy(busy) {
      document.querySelectorAll("button").forEach((button) => {
        button.disabled = busy;
      });
    }
  </script>
</body>
</html>
