recipe_id: nextcloud
name: Nextcloud
description: Self-hosted file sharing and collaboration
category: productivity
icon: nextcloud.svg
version: 1.0.0

requires:
  - "podman>=4.4"
  - cgroups_v2

parameters:
  - key: domain
    label: Domain name
    type: string
    required: true
    placeholder: cloud.example.com

  - key: admin_password
    label: Admin password
    type: secret
    required: true
    generate: random_32

  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: random_32

  - key: data_volume_size
    label: Data volume size (GB)
    type: integer
    default: 10
    min: 1
    max: 1000

  - key: enable_redis
    label: Enable Redis caching
    type: boolean
    default: true

resources:
  - type: network
    filename: "{{ recipe_id }}-net.network"
    template: networks/bridge.network.tera

  - type: volume
    filename: "{{ recipe_id }}-db.volume"
    template: volumes/named.volume.tera

  - type: volume
    filename: "{{ recipe_id }}-data.volume"
    template: volumes/named.volume.tera

  - type: container
    filename: "{{ recipe_id }}-db.container"
    template: containers/mariadb.container.tera

  - type: container
    filename: "{{ recipe_id }}-app.container"
    template: containers/nextcloud.container.tera
    depends_on:
      - "{{ recipe_id }}-db.container"

  - type: container
    filename: "{{ recipe_id }}-redis.container"
    template: containers/redis.container.tera
    condition: "enable_redis == true"
    depends_on:
      - "{{ recipe_id }}-net.network"
