recipe_id: nextcloud
name: Nextcloud
description: Run Nextcloud with MariaDB, optional Redis, and managed Podman volumes.
category: apps
icon: nextcloud
version: 0.1.0
requires:
  - podman
  - quadlets
parameters:
  - key: app_id
    label: App ID
    type: string
    required: true
    default: nextcloud
  - key: domain
    label: Domain
    type: string
    required: true
    default: cloud.example.com
  - key: host_port
    label: Host port
    type: integer
    required: true
    default: 8081
    min: 1
    max: 65535
  - key: overwrite_protocol
    label: Public protocol
    type: choice
    required: true
    default: https
    options:
      - https
      - http
  - key: admin_user
    label: Admin user
    type: string
    required: true
    default: admin
  - key: admin_password
    label: Admin password
    type: secret
    required: true
    generate: random_32
  - key: database_name
    label: Database name
    type: string
    required: true
    default: nextcloud
  - key: database_user
    label: Database user
    type: string
    required: true
    default: nextcloud
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: random_32
  - key: enable_redis
    label: Enable Redis cache
    type: boolean
    required: true
    default: true
  - key: php_memory_limit
    label: PHP memory limit
    type: string
    required: true
    default: 512M
  - key: upload_limit
    label: Upload limit
    type: string
    required: true
    default: 2G
  - key: trusted_proxies
    label: Trusted proxies
    type: string
    required: false
    default: ""
resources:
  - type: network
    filename: "{{ app_id }}-net.network"
    template: networks/bridge.network.tera
  - type: volume
    filename: "{{ app_id }}-data.volume"
    template: volumes/named.volume.tera
  - type: volume
    filename: "{{ app_id }}-db.volume"
    template: volumes/named.volume.tera
  - type: container
    filename: "{{ app_id }}-db.container"
    template: containers/mariadb.container.tera
  - type: container
    filename: "{{ app_id }}-redis.container"
    template: containers/redis.container.tera
    condition: "enable_redis == true"
  - type: container
    filename: "{{ app_id }}-app.container"
    template: containers/nextcloud.container.tera
