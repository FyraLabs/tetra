[package]
name = "tetra"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "A recipe/user-config layer for generating Podman Quadlets with Podlet"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shlex = "1.3"
tera = "1.20"
which = "7"

[dev-dependencies]
tempfile = "3"
