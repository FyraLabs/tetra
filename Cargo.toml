[package]
name = "tetra"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "A modular host agent and recipe layer for generating and managing Podman Quadlets"

[features]
default = [
    "files",
    "recipes",
    "selinux",
    "services",
    "quadlets",
]
files = []
recipes = []
selinux = []
services = []
storage = []
samba = []
nfs = []
network = []
podman = []
quadlets = []
users = []
virtual-machines = []

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tera = "2.0"

[dev-dependencies]
tempfile = "3"
